<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refinery fixture: tokens only</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { margin: 0; background: var(--color-ground); color: var(--color-muted); font-family: var(--type-body-font-family); font-size: var(--type-body-font-size); line-height: var(--type-body-line-height); }
  main { max-width: 1280px; margin: 0 auto; padding: var(--space-30) var(--space-20); }
  h1 { color: var(--color-ink); font-family: var(--type-hero-font-family); font-size: var(--type-hero-font-size); font-weight: var(--type-hero-font-weight); line-height: var(--type-hero-line-height); letter-spacing: var(--type-hero-letter-spacing); margin: 0 0 var(--space-5); }
  .card { background: var(--card-background-color); border: 1px solid var(--color-border); border-radius: var(--card-rounded); padding: var(--card-padding); }
  .btn { background: var(--button-primary-background-color); color: var(--button-primary-text-color); border: 0; border-radius: var(--button-primary-rounded); padding: var(--space-3) var(--space-6); font: var(--type-button-font-weight) var(--type-button-font-size) var(--type-button-font-family); }
</style>
</head>
<body>
<main>
  <h1>Prove the AI's COBOL change is safe</h1>
  <div class="card">
    <p>Eleven deterministic checks, a semantic engine and a formal proof, signed into one certificate a named human signs off.</p>
    <button class="btn" type="button">Audit a change</button>
  </div>
</main>
</body>
</html>
